name: Android build

# The Android counterpart of linux.yml, in two jobs. `verify` is the
# game compiled and linked for the NDK as the shared library the
# android/ Gradle project packages, through the same script a
# developer runs locally (tools/ci/verify-android.sh); it is the part
# that rots, and it needs no SDK. `apk` is the package: the Gradle
# project's release build through tools/android/build-apk.sh, named
# and checksummed the way the other platforms' packages are, uploaded
# as an artifact on every run - the way the macOS packages reach a
# release today - and, on a v* tag, attached to that tag's release.
# No tests here: the unit binary is an executable nothing on this
# runner can run for arm64, and the Linux jobs run the same libraries'
# tests. The SDL family and libjpeg-turbo are built from source by
# tools/android/build-deps.sh in each job, about two minutes; a cache
# keyed on that script's pinned versions would be the first thing to
# add if the job ever becomes the slow one.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: libmain.so arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cmake and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl

      # The runner image ships an NDK and names the newest one in
      # ANDROID_NDK_LATEST_HOME; the preset reads ANDROID_NDK_HOME.
      - name: Build the libraries and the game
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: tools/ci/verify-android.sh

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-android
          retention-days: 7
          path: |
            build/verification/
            build/android/deps-logs/
            build/presets/android/CMakeFiles/CMakeConfigureLog.yaml

  apk:
    name: APK arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The release upload below writes to the repository's releases;
    # nothing else in this workflow needs more than read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cmake, ninja and the SDK components
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" > /dev/null

      # The version is the tag without its v on a tag push, and
      # 0.0.0-<sha> otherwise: a build that any release replaces. The
      # keystore, when the repository has the secrets, is decoded for
      # the build and never leaves the runner; without it the package
      # is debug-signed and says so (android/README.md, "Releases").
      - name: Build the libraries and the APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            *) version="0.0.0-$(git rev-parse --short HEAD)" ;;
          esac
          echo "version=$version" >> "$GITHUB_ENV"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          fi
          tools/android/build-apk.sh "$version"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: darkeden-client-${{ env.version }}-android-arm64
          retention-days: 30
          path: build/android/dist/

      # The release for the tag normally exists already - the owner
      # creates it, and that creates the tag - and gets the package
      # and its checksum; a tag pushed without one gets a draft
      # release holding them, to be written up and published by hand.
      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" build/android/dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" build/android/dist/* --repo "$GITHUB_REPOSITORY" --draft \
              --title "DarkEden client $version" \
              --notes "Android package attached by the Android workflow; notes to follow."
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-android-apk
          retention-days: 7
          path: |
            build/verification/
            build/android/deps-logs/
