name: Android build

# The Android counterpart of linux.yml: the game compiled and linked
# for the NDK as the shared library the android/ Gradle project
# packages. No tests (the unit binary cannot run here) and no APK (the
# SDK is not needed to prove the part that rots, which is the link),
# through the same script a developer runs locally
# (tools/ci/verify-android.sh). The SDL family and libjpeg-turbo are
# built from source by tools/android/build-deps.sh on every run, about
# two minutes; a cache keyed on that script's pinned versions would be
# the first thing to add if the job ever becomes the slow one.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install cmake and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl

      # The runner image ships an NDK and names the newest one in
      # ANDROID_NDK_LATEST_HOME; the preset reads ANDROID_NDK_HOME.
      - name: Build the libraries and the game
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: tools/ci/verify-android.sh

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-android
          retention-days: 7
          path: |
            build/verification/
            build/android/deps-logs/
            build/presets/android/CMakeFiles/CMakeConfigureLog.yaml
